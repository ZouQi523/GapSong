name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    name: Package & publish
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: ./build.sh

      - name: Package
        run: |
          cd build
          # build.sh 已经生成了签名并清理过扩展属性的 GapSong.zip
          cp GapSong.zip "GapSong-${GITHUB_REF_NAME}.zip"
          shasum -a 256 "GapSong-${GITHUB_REF_NAME}.zip" > "GapSong-${GITHUB_REF_NAME}.zip.sha256"

      - name: Publish
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            build/GapSong-*.zip
            build/GapSong-*.zip.sha256
